name: Future value research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/future-value-research.yml
      - data/lol/v2/evaluation/future-value-rating-protocol-v1.json
      - data/lol/v2/evaluation/future-value-source-freeze-20260820.json
      - lol_kills/research/future_phase_curve.py
      - lol_kills/research/future_value_rating.py
      - lol_kills/research/future_value_training.py
      - tests/test_future_value*.py

permissions:
  contents: read

concurrency:
  group: future-value-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-source:
    name: Future value research checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install the hashed CI environment
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Prepare the isolated runtime
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/scryglass-future-value"
          raw_root="${runtime_root}/data/lol/warehouse/raw"
          output_root="${RUNNER_TEMP}/future-value-artifacts"
          {
            echo "SCRYGLASS_RUNTIME_ROOT=${runtime_root}"
            echo "SCRYGLASS_OE_RAW_DIR=${raw_root}"
            echo "FUTURE_VALUE_OUTPUT_ROOT=${output_root}"
          } >> "${GITHUB_ENV}"
          mkdir -p "${raw_root}" "${output_root}"

      - name: Download the frozen Oracle's Elixir annual exports
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python -m lol_kills.etl.oe_fetch \
            --year 2025 \
            --destination "${SCRYGLASS_OE_RAW_DIR}/2025_LoL_esports_match_data_from_OraclesElixir.csv"
          python -m lol_kills.etl.oe_fetch \
            --year 2026 \
            --destination "${SCRYGLASS_OE_RAW_DIR}/2026_LoL_esports_match_data_from_OraclesElixir.csv"

      - name: Reject changed annual source bytes
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m lol_kills.research.future_value_training \
            --annual-root "${SCRYGLASS_OE_RAW_DIR}" \
            --freeze data/lol/v2/evaluation/future-value-source-freeze-20260820.json \
            --output-root "${FUTURE_VALUE_OUTPUT_ROOT}" \
            --annual-only

      - name: Build the isolated OE warehouse
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m lol_kills.refresh_warehouse \
            --oe-years 2025 2026 \
            --skip-lp \
            --skip-grid

      - name: Verify the exact census and research receipt
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m lol_kills.research.future_value_training \
            --annual-root "${SCRYGLASS_OE_RAW_DIR}" \
            --oe-root "${SCRYGLASS_RUNTIME_ROOT}/data/lol/warehouse/parquet" \
            --freeze data/lol/v2/evaluation/future-value-source-freeze-20260820.json \
            --output-root "${FUTURE_VALUE_OUTPUT_ROOT}"

      - name: Run focused contract tests
        run: python -m pytest -q tests/test_future_value*.py

      - name: Write the research summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["FUTURE_VALUE_OUTPUT_ROOT"]) / "future-value-research-run.json"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Future value research\n\n")
              if not path.is_file():
                  stream.write("The pull-request checks passed without downloading the frozen OE files.\n")
                  stream.write("Run the manual workflow for the full frozen-source receipt.\n")
              else:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  stream.write(f"- Status: `{value['status']}`\n")
                  stream.write(f"- Accepted maps: `{value['source_game_count']}`\n")
                  stream.write(f"- Model-eligible maps: `{value['model_eligible_game_count']}`\n")
                  stream.write(f"- Source identity: `{value['source_identity_sha256']}`\n")
                  stream.write(f"- Public authority: `false`\n")
          PY

      - name: Upload research receipts
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: future-value-research-${{ github.run_id }}
          path: ${{ runner.temp }}/future-value-artifacts
          if-no-files-found: error
          retention-days: 14
