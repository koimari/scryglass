name: Publish live GRID snapshots

on:
  workflow_dispatch:

concurrency:
  group: live-grid-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BLOB_STORE_ID: store_97gKs2fObqKgpPWx

    steps:
      - name: Check out the publication
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live-feed dependencies
        run: python -m pip install --disable-pip-version-check websockets pandas

      - name: Listen for live pro series and publish verified snapshots
        run: |
          test -n "$GRID_API_KEY" || (echo "GRID_API_KEY secret is required" && exit 1)
          test -n "$BLOB_READ_WRITE_TOKEN" || (echo "BLOB_READ_WRITE_TOKEN secret is required" && exit 1)
          python3 -m lol_kills.live_worker \
            --seconds 240 \
            --series-seconds 240 \
            --discovery-seconds 30
