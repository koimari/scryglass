name: Refresh public Scryglass pack

on:
  workflow_dispatch:
    inputs:
      grid_days:
        description: "GRID lookback window for a manual catch-up run"
        required: false
        default: "3"
        type: string
      grid_limit:
        description: "Maximum recent GRID series to inspect"
        required: false
        default: "40"
        type: string
      grid_tournament:
        description: "Optional tournament substring for a targeted manual catch-up"
        required: false
        default: ""
        type: string
      continuous:
        description: "Keep dispatching one successor run after this run finishes"
        required: false
        default: true
        type: boolean
  schedule:
    # Watchdog only. The primary cadence is the authenticated successor
    # dispatch at the end of each run, avoiding GitHub's best-effort scheduler.
    - cron: "7 * * * *"

concurrency:
  group: refresh-public-pack
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Check out the publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the warehouse cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/lol/warehouse
            data/lol/features
            data/lol/models
          key: scryglass-warehouse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scryglass-warehouse-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt gdown

      - name: Restore the durable derived warehouse snapshot
        run: |
          python3 -m lol_kills.export.warehouse_snapshot restore \
            --pointer data/lol/warehouse_snapshot.json

      - name: Refresh GRID recent games, ratings, and pack
        run: |
          test -n "$GRID_API_KEY" || (echo "GRID_API_KEY secret is required" && exit 1)
          test -n "$BLOB_READ_WRITE_TOKEN" || (echo "BLOB_READ_WRITE_TOKEN secret is required" && exit 1)
          python3 -m lol_kills.update_public_pack \
            --years 2025,2026 \
            --skip-oe \
            --download-grid \
            --grid-days "${{ inputs.grid_days || '3' }}" \
            --grid-limit "${{ inputs.grid_limit || '8' }}" \
            ${{ inputs.grid_tournament && format('--grid-tournament "{0}"', inputs.grid_tournament) || '' }} \
            --allow-missing-lp \
            --publish

      - name: Save the durable derived warehouse snapshot
        run: |
          python3 -m lol_kills.export.warehouse_snapshot save \
            --pointer data/lol/warehouse_snapshot.json

      - name: Save the refreshed warehouse cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/lol/warehouse
            data/lol/features
            data/lol/models
          key: scryglass-warehouse-${{ runner.os }}-${{ github.run_id }}

      - name: Continue the refresh chain
        if: ${{ always() && (github.event_name == 'schedule' || inputs.continuous) && vars.PACK_REFRESH_CHAIN != 'paused' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GRID_DAYS: ${{ inputs.grid_days || '3' }}
          GRID_LIMIT: ${{ inputs.grid_limit || '40' }}
          GRID_TOURNAMENT: ${{ inputs.grid_tournament || '' }}
        run: |
          active_successors="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-public-pack.yml/runs" \
              -f branch="$GITHUB_REF_NAME" \
              -f per_page=20 |
              jq --arg run_id "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select((.id | tostring) != $run_id and .status != "completed")] | length'
          )"
          if [ "$active_successors" -gt 0 ]; then
            echo "A successor is already active or pending; not dispatching another."
            exit 0
          fi

          gh workflow run refresh-public-pack.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f grid_days="$GRID_DAYS" \
            -f grid_limit="$GRID_LIMIT" \
            -f grid_tournament="$GRID_TOURNAMENT" \
            -f continuous=true
