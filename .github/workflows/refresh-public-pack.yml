name: Refresh public Scryglass pack

on:
  workflow_dispatch:
  schedule:
    # GRID supplies the freshness bridge. OE reconciliation runs separately
    # so a Google Drive quota response cannot block current match rows.
    - cron: "*/15 * * * *"

concurrency:
  group: refresh-public-pack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Check out the publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the warehouse cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/lol/warehouse
            data/lol/features
            data/lol/models
          key: scryglass-warehouse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scryglass-warehouse-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt gdown

      - name: Restore the durable derived warehouse snapshot
        run: |
          python3 -m lol_kills.export.warehouse_snapshot restore \
            --pointer data/lol/warehouse_snapshot.json

      - name: Refresh GRID recent games, ratings, and pack
        run: |
          test -n "$GRID_API_KEY" || (echo "GRID_API_KEY secret is required" && exit 1)
          test -n "$BLOB_READ_WRITE_TOKEN" || (echo "BLOB_READ_WRITE_TOKEN secret is required" && exit 1)
          python3 -m lol_kills.update_public_pack \
            --years 2025,2026 \
            --skip-oe \
            --download-grid \
            --allow-missing-lp \
            --publish

      - name: Save the durable derived warehouse snapshot
        run: |
          python3 -m lol_kills.export.warehouse_snapshot save \
            --pointer data/lol/warehouse_snapshot.json

      - name: Save the refreshed warehouse cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/lol/warehouse
            data/lol/features
            data/lol/models
          key: scryglass-warehouse-${{ runner.os }}-${{ github.run_id }}

      - name: Commit the small latest-pack pointers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/lol-atlas/public/packs/manifest.json \
            apps/lol-atlas/public/packs/latest.json \
            data/lol/warehouse_snapshot.json
          if git diff --cached --quiet; then
            echo "Pack pointer did not change"
            exit 0
          fi
          git commit -m "chore(data): refresh public pack [skip ci]"
          git push

      - name: Trigger an optional Vercel deploy hook
        if: ${{ vars.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ vars.VERCEL_DEPLOY_HOOK_URL }}
