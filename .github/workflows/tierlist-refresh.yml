name: Refresh development tier lists

on:
  workflow_dispatch:
  # Optional weekly automation. Enable by uncommenting; the commit step below
  # then runs on schedule with contents: write.
  # schedule:
  #   - cron: "0 6 * * 1"   # Mondays 06:00 UTC

concurrency:
  group: tierlist-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the warehouse cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/lol/warehouse
            data/lol/features
            data/lol/models
          key: scryglass-warehouse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scryglass-warehouse-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt gdown

      - name: Restore the durable derived warehouse snapshot
        run: |
          python3 -m lol_kills.export.warehouse_snapshot restore \
            --pointer data/lol/warehouse_snapshot.json

      - name: Regenerate the development tier-list cells and scope index
        run: |
          python3 -m lol_kills.v2.tierlists.scope_index --root .

      - name: Commit the refreshed tier lists when they changed
        run: |
          if ! git diff --quiet -- data/lol/v2/tierlists; then
            git config user.name "scryglass-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/lol/v2/tierlists
            git commit -m "chore(data): refresh development tier lists [skip ci]"
            git push
          else
            echo "tier-list artifacts unchanged; nothing to commit"
          fi
