name: Validate Scryglass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow and shell security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.7

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: ./ops
          ignore_paths: ops/launchd
          version: v0.11.0

      - name: Parse zsh operator scripts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1; then
            sudo timeout --foreground 60s apt-get install --no-install-recommends -y zsh
          fi
          while IFS= read -r -d '' script; do
            zsh -n "$script"
          done < <(find ops/launchd -type f -name '*.sh' -print0)

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/scryglass
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scryglass/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Audit app dependencies
        run: npm audit --audit-level=low

      - name: Assert deterministic test command (listen EPERM regression)
        run: |
          node -e '
            const pkg = require("./package.json");
            const script = (pkg.scripts && pkg.scripts.test) || "";
            const tokens = script.split(/\s+/).filter(Boolean);
            const commands = [tokens[0], ...script
              .split(/&&|\|\|/)
              .map((part) => part.split(/\s+/).filter(Boolean)[0])
              .filter(Boolean)
              .map((first) => first.replace(/^npx\s+/, ""))];
            const nodeForm = tokens[0] === "node" &&
              tokens.includes("--import") && tokens[tokens.indexOf("--import") + 1] === "tsx" &&
              tokens.includes("--test");
            const ipcForm = commands.some((command) => command === "tsx");
            if (!nodeForm || ipcForm) {
              console.error("test script regressed to the tsx CLI IPC-listener form (listen EPERM failure mode):");
              console.error("  script = " + JSON.stringify(script));
              process.exit(1);
            }
            console.log("test_command=" + script);
          '

      - name: Lint
        timeout-minutes: 5
        run: npm run lint

      - name: Check public boundary
        timeout-minutes: 2
        run: npm run audit:public-boundary

      - name: Type check
        timeout-minutes: 5
        run: npx tsc --noEmit --allowImportingTsExtensions

      - name: TypeScript tests
        id: tests
        timeout-minutes: 10
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          set -e
          echo "test_status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Production build
        id: build
        timeout-minutes: 12
        run: npm run build

      - name: Check built public boundary
        timeout-minutes: 2
        run: npm run audit:public-boundary

      - name: Create app SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Record validation identity
        if: always()
        run: |
          node_version="$(node --version)"
          commit_sha="${GITHUB_SHA}"
          lock_sha256="$(shasum -a 256 package-lock.json | awk '{print $1}')"
          build_id="missing"
          if [ -f .next/BUILD_ID ]; then build_id="$(cat .next/BUILD_ID)"; fi
          test_status="${{ steps.tests.outputs.test_status }}"
          if [ -z "$test_status" ]; then test_status="not_run"; fi
          if [ "$test_status" = "0" ]; then
            tests_total="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 tests (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            tests_pass="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 pass (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            tests_fail="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 fail (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            failure_class="none"
          else
            tests_total="unknown"
            tests_pass="unknown"
            tests_fail="unknown"
            if grep -qE "listen EPERM|EACCES|ERR_STREAM|spawn .* EPERM" test-output.log 2>/dev/null; then
              failure_class="infra:test_runner_spawn"
            elif [ "$test_status" = "not_run" ]; then
              failure_class="not_run"
            else
              failure_class="test_failure"
            fi
          fi
          {
            echo "node_version=$node_version"
            echo "commit_sha=$commit_sha"
            echo "lock_sha256=$lock_sha256"
            echo "test_status=$test_status"
            echo "tests_total=$tests_total"
            echo "tests_pass=$tests_pass"
            echo "tests_fail=$tests_fail"
            echo "failure_class=$failure_class"
            echo "build_id=$build_id"
          } | tee validation-record.txt
          {
            echo "## Validation record"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| node_version | $node_version |"
            echo "| commit_sha | $commit_sha |"
            echo "| lock_sha256 | $lock_sha256 |"
            echo "| test_status | $test_status |"
            echo "| tests_total | $tests_total |"
            echo "| tests_pass | $tests_pass |"
            echo "| tests_fail | $tests_fail |"
            echo "| failure_class | $failure_class |"
            echo "| build_id | $build_id |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-record
          path: |
            apps/scryglass/validation-record.txt
            apps/scryglass/sbom.cdx.json
          if-no-files-found: error

  browser:
    name: browser
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRYGLASS_E2E_LOCAL_PACK: "1"
    defaults:
      run:
        working-directory: apps/scryglass
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scryglass/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install the Chromium test runtime
        run: npx playwright install --with-deps chromium

      - name: Generate the deterministic browser pack
        run: npm run e2e:pack

      - name: Build the production app
        run: npm run build

      - name: Run browser, protocol-fuzz, and bounded-load checks
        timeout-minutes: 12
        run: |
          set -euo pipefail
          server_log="${RUNNER_TEMP}/scryglass-next.log"
          npm run start -- --hostname 127.0.0.1 --port 3100 >"${server_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${server_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/chat >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              exit 1
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${server_log}"
              exit 1
            fi
            sleep 1
          done

          cat >"${RUNNER_TEMP}/playwright-ci.config.mjs" <<'EOF'
          export default {
            testDir: process.env.GITHUB_WORKSPACE + "/apps/scryglass/e2e",
            fullyParallel: false,
            outputDir: process.env.GITHUB_WORKSPACE + "/apps/scryglass/output/playwright/ci-results",
            retries: 0,
            reporter: "line",
            workers: 1,
            use: {
              baseURL: "http://127.0.0.1:3100",
              trace: "retain-on-failure",
            },
          };
          EOF
          npx playwright test --config="${RUNNER_TEMP}/playwright-ci.config.mjs"

          node --input-type=module <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const base = "http://127.0.0.1:3100";
          const request = (path, init = {}) => fetch(base + path, {
            signal: AbortSignal.timeout(5_000),
            ...init,
          });

          const cases = [
            {
              name: "unsupported method",
              expected: 405,
              noStore: false,
              run: () => request("/api/chat/query_players", { method: "PUT" }),
            },
            {
              name: "invalid content type",
              expected: 415,
              run: () => request("/api/chat/query_players", {
                method: "POST",
                headers: { "content-type": "text/plain", "x-forwarded-for": "192.0.2.10" },
                body: "{}",
              }),
            },
            {
              name: "invalid JSON",
              expected: 400,
              run: () => request("/api/chat/query_players", {
                method: "POST",
                headers: { "content-type": "application/json", "x-forwarded-for": "192.0.2.11" },
                body: "{",
              }),
            },
            {
              name: "oversize body",
              expected: 413,
              run: () => request("/api/chat/query_players", {
                method: "POST",
                headers: { "content-type": "application/json", "x-forwarded-for": "192.0.2.12" },
                body: JSON.stringify({ plan: "x".repeat(9_000) }),
              }),
            },
            {
              name: "oversize query",
              expected: 422,
              run: () => request(`/api/chat/query_players?q=${"x".repeat(501)}`, {
                headers: { "x-forwarded-for": "192.0.2.13" },
              }),
            },
          ];
          for (const testCase of cases) {
            const response = await testCase.run();
            assert(response.status === testCase.expected,
              `${testCase.name}: expected ${testCase.expected}, received ${response.status}`);
            if (testCase.noStore !== false) {
              assert((response.headers.get("cache-control") ?? "").includes("no-store"),
                `${testCase.name}: error response must be private and uncached`);
            }
          }

          const rateResponses = await Promise.all(Array.from({ length: 21 }, () =>
            request("/api/chat/query_players", {
              headers: { "x-forwarded-for": "198.51.100.10" },
            })));
          assert(rateResponses.filter((response) => response.status === 429).length >= 1,
            "chat burst budget did not return 429");

          const startedAt = Date.now();
          const loadResponses = await Promise.all(Array.from({ length: 40 }, () => request("/robots.txt")));
          assert(loadResponses.every((response) => response.ok), "bounded load smoke returned an error");
          const bodies = await Promise.all(loadResponses.map((response) => response.arrayBuffer()));
          assert(bodies.every((body) => body.byteLength <= 500 * 1024), "bounded response budget exceeded");
          assert(Date.now() - startedAt <= 5_000, "bounded load smoke exceeded five seconds");
          NODE

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: apps/scryglass/output/playwright/ci-results
          if-no-files-found: warn

  elemental-drakes:
    name: elemental-drakes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/elemental-drakes
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/elemental-drakes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Create dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elemental-drakes-sbom
          path: apps/elemental-drakes/sbom.cdx.json
          if-no-files-found: error

  rankings-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CI: "true"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements.lock

      - name: Install the hashed CI environment
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Audit Python dependencies
        run: python -m pip_audit --disable-pip -r requirements.lock

      - name: Scan Python security issues
        run: python -m bandit -r lol_kills tools -x tests -lll -q

      - name: Create Python SBOM
        run: python -m pip_audit --disable-pip -r requirements.lock --format cyclonedx-json --output python-sbom.cdx.json

      - name: Install zsh for the launcher behaviour tests
        run: |
          # tests/test_public_refresh_launcher.py executes
          # ops/launchd/run-public-refresh.sh directly and its shebang is
          # /bin/zsh, which ubuntu-latest does not guarantee. The conditional
          # zsh install in the workflow-security job does not carry over to
          # this runner.
          if ! command -v zsh >/dev/null 2>&1; then
            sudo timeout --foreground 60s apt-get install --no-install-recommends -y zsh
          fi
      - name: Run the public release Python suite, pass 1
        timeout-minutes: 110
        run: |
          python -m pytest -q \
            tests/test_patch_identity.py \
            tests/test_lcc_atom_refresh_receipt.py \
            tests/model_v2/champions/test_atom_bridge.py \
            tests/model_v2/champions/test_depth2_aggregate.py \
            tests/model_v2/champions/test_atom_seed_v1.py \
            tests/model_v2/tierlists/test_live_refresh.py \
            tests/model_v2/tierlists/test_production_bundle.py \
            tests/model_v2/tierlists/test_filters.py \
            tests/model_v2/tierlists/test_atom_matchup_features.py \
            tests/model_v2/tierlists/test_joint_pooled_model.py \
            tests/model_v2/tierlists/test_pooled_candidate.py \
            tests/model_v2/tierlists/test_production_readiness.py \
            tests/model_v2/tierlists/test_prospective_evaluation.py \
            tests/test_public_asset_allowlist_contract.py \
            tests/test_public_pack_spec.py \
            tests/test_public_query_projection.py \
            tests/test_public_refresh.py \
            tests/test_public_refresh_launcher.py \
            tests/test_oe_fetch.py \
            tests/test_refresh_ledger.py \
            tests/test_supabase_publication.py \
            tests/test_upload_pack.py \
            tests/test_network_guards.py \
            tests/test_public_schedule.py \
            tests/test_public_release_migration_phases.py \
            tests/test_public_grid_isolation.py \
            tests/test_retire_public_blob_store.py

      - name: Run the public release Python suite, pass 2
        timeout-minutes: 110
        run: |
          python -m pytest -q \
            tests/test_patch_identity.py \
            tests/test_lcc_atom_refresh_receipt.py \
            tests/model_v2/champions/test_atom_bridge.py \
            tests/model_v2/champions/test_depth2_aggregate.py \
            tests/model_v2/champions/test_atom_seed_v1.py \
            tests/model_v2/tierlists/test_live_refresh.py \
            tests/model_v2/tierlists/test_production_bundle.py \
            tests/model_v2/tierlists/test_filters.py \
            tests/model_v2/tierlists/test_atom_matchup_features.py \
            tests/model_v2/tierlists/test_joint_pooled_model.py \
            tests/model_v2/tierlists/test_pooled_candidate.py \
            tests/model_v2/tierlists/test_production_readiness.py \
            tests/model_v2/tierlists/test_prospective_evaluation.py \
            tests/test_public_asset_allowlist_contract.py \
            tests/test_public_pack_spec.py \
            tests/test_public_query_projection.py \
            tests/test_public_refresh.py \
            tests/test_public_refresh_launcher.py \
            tests/test_oe_fetch.py \
            tests/test_refresh_ledger.py \
            tests/test_supabase_publication.py \
            tests/test_upload_pack.py \
            tests/test_network_guards.py \
            tests/test_public_schedule.py \
            tests/test_public_release_migration_phases.py \
            tests/test_public_grid_isolation.py \
            tests/test_retire_public_blob_store.py

      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: python-sbom.cdx.json
          if-no-files-found: error

  supabase:
    name: Supabase clean replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Replay migrations from zero
        run: npx supabase db reset

      - name: Lint the final schema
        run: npx supabase db lint --level error

      - name: Test final privileges and release behavior
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
