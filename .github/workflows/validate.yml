name: Validate Scryglass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/scryglass
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scryglass/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record build identity
        run: |
          test -f .next/BUILD_ID
          printf 'node=%s\n' "$(node --version)"
          printf 'build_id=%s\n' "$(cat .next/BUILD_ID)"
