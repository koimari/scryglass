name: Validate Scryglass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/scryglass
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scryglass/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Assert deterministic test command (listen EPERM regression)
        run: |
          node -e '
            const pkg = require("./package.json");
            const script = (pkg.scripts && pkg.scripts.test) || "";
            const tokens = script.split(/\s+/).filter(Boolean);
            const commands = [tokens[0], ...script
              .split(/&&|\|\|/)
              .map((part) => part.split(/\s+/).filter(Boolean)[0])
              .filter(Boolean)
              .map((first) => first.replace(/^npx\s+/, ""))];
            const nodeForm = tokens[0] === "node" &&
              tokens.includes("--import") && tokens[tokens.indexOf("--import") + 1] === "tsx" &&
              tokens.includes("--test");
            const ipcForm = commands.some((command) => command === "tsx");
            if (!nodeForm || ipcForm) {
              console.error("test script regressed to the tsx CLI IPC-listener form (listen EPERM failure mode):");
              console.error("  script = " + JSON.stringify(script));
              process.exit(1);
            }
            console.log("test_command=" + script);
          '

      - name: Lint
        timeout-minutes: 5
        run: npm run lint

      - name: Check public boundary
        timeout-minutes: 2
        run: npm run audit:public-boundary

      - name: Type check
        timeout-minutes: 5
        run: npx tsc --noEmit --allowImportingTsExtensions

      - name: TypeScript tests
        id: tests
        timeout-minutes: 10
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          set -e
          echo "test_status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Production build
        id: build
        timeout-minutes: 12
        run: npm run build

      - name: Record validation identity
        if: always()
        run: |
          node_version="$(node --version)"
          build_id="missing"
          if [ -f .next/BUILD_ID ]; then build_id="$(cat .next/BUILD_ID)"; fi
          test_status="${{ steps.tests.outputs.test_status }}"
          if [ -z "$test_status" ]; then test_status="not_run"; fi
          if [ "$test_status" = "0" ]; then
            tests_total="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 tests (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            tests_pass="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 pass (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            tests_fail="$(node -e 'const s=require("fs").readFileSync("test-output.log","utf8"); const m=s.match(/\u2139 fail (\d+)/); process.stdout.write(m?m[1]:"unknown")' 2>/dev/null || echo unknown)"
            failure_class="none"
          else
            tests_total="unknown"
            tests_pass="unknown"
            tests_fail="unknown"
            if grep -qE "listen EPERM|EACCES|ERR_STREAM|spawn .* EPERM" test-output.log 2>/dev/null; then
              failure_class="infra:test_runner_spawn"
            elif [ "$test_status" = "not_run" ]; then
              failure_class="not_run"
            else
              failure_class="test_failure"
            fi
          fi
          {
            echo "node_version=$node_version"
            echo "test_status=$test_status"
            echo "tests_total=$tests_total"
            echo "tests_pass=$tests_pass"
            echo "tests_fail=$tests_fail"
            echo "failure_class=$failure_class"
            echo "build_id=$build_id"
          } | tee validation-record.txt
          {
            echo "## Validation record"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| node_version | $node_version |"
            echo "| test_status | $test_status |"
            echo "| tests_total | $tests_total |"
            echo "| tests_pass | $tests_pass |"
            echo "| tests_fail | $tests_fail |"
            echo "| failure_class | $failure_class |"
            echo "| build_id | $build_id |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-record
          path: apps/scryglass/validation-record.txt
          if-no-files-found: error

  rankings-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install -r apps/scryglass/requirements.txt pytest

      - name: Validate ratings and patch-wide tier contracts
        run: >-
          python -m pytest -q
          tests/model_v2/tierlists/test_champion_elo.py
          tests/model_v2/tierlists/test_joint_pooled_model.py
          tests/model_v2/tierlists/test_production_bundle.py
          tests/model_v2/tierlists/test_production_readiness.py
          tests/model_v2/tierlists/test_oe_api_ingest.py
          tests/model_v2/tierlists/test_live_refresh.py
          tests/test_global_player_bt.py
          tests/test_player_map_grades.py
          tests/test_postgame_sync.py
          tests/test_public_pack_spec.py
          tests/test_competition_and_ratings.py
          tests/test_manual_leaguepedia.py
